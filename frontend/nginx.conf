map $http_x_forwarded_proto $redirect_https {
    default 0;
    http 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The HTTP Ingress forwards only to this redirect; HTTPS routes API calls directly to Spring Boot.
    if ($redirect_https) {
        return 308 https://$host$request_uri;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location ~ ^/(api|actuator)(/|$) {
        return 404;
    }
    location ~* \.(js|css|ico|png|svg|jpg|jpeg|woff|woff2)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
