map $http_x_forwarded_proto $redirect_https {
    default 0;
    http 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The HTTP Ingress forwards only to this redirect; HTTPS routes API calls directly to Spring Boot.
    if ($redirect_https) {
        return 308 https://$host$request_uri;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location ~ ^/(api|actuator)(/|$) {
        return 404;
    }
    location ~* \.(js|css|ico|png|svg|jpg|jpeg|woff|woff2)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
