# .github/workflows/capstone-cd.yml
name: Capstone CD
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('{0} by {1}', inputs.action, github.actor) }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "rollback: restore the last release whose smoke passed. restore-drill: back up, then time a restore into a scratch database. infra-plan, infra-apply: Terraform and Ansible"
        required: true
        type: choice
        options: [rollback, restore-drill, infra-plan, infra-apply]
      plan_digest:
        description: "infra-apply only: the plan digest that infra-plan printed"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# one release at a time, and never cancel one halfway through
concurrency:
  group: release-production
  cancel-in-progress: false

env:
  NAMESPACE: student08
  KUBECONFIG: ${{ github.workspace }}/.kube/config
  KUBE_CONFIG_PATH: ${{ github.workspace }}/.kube/config

jobs:
  # --- promote: deploy the API/UI pair main already built for the tagged commit, then smoke ---
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find the main CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow capstone-ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful main CI run for $GITHUB_SHA. Tag a commit that main has built."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name image-report --dir release
          echo "Releasing the pair from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Cluster credentials
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s\n' "$KUBECONFIG_DATA" > "$KUBECONFIG"
      - name: Install Terraform and Ansible
        run: bash scripts/install-iac-tools.sh
      - name: Infrastructure matches this commit
        working-directory: infra/terraform
        env:
          TF_VAR_ingress_namespace: ${{ vars.INGRESS_NAMESPACE }}
          TF_VAR_storage_class: ${{ vars.STORAGE_CLASS }}
        run: |
          terraform init -input=false > /dev/null
          status=0
          terraform plan -input=false -lock-timeout=120s -detailed-exitcode > /dev/null || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error::The namespace doesn't match infra/terraform. Run CD with infra-plan, review it, then infra-apply."
          fi
          exit "$status"
      - name: Configure
        run: ansible-playbook -i infra/ansible/inventory.yml -e crm_context="$(kubectl config current-context)" infra/ansible/configure.yml
      - name: Secrets
        env:
          CRM_DB_PASSWORD: ${{ secrets.CRM_DB_PASSWORD }}
          CRM_AGENT_PASSWORD: ${{ secrets.CRM_AGENT_PASSWORD }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          CRM_JWT_PRIVATE_KEY: ${{ secrets.CRM_JWT_PRIVATE_KEY }}
          CRM_JWT_PUBLIC_KEY: ${{ secrets.CRM_JWT_PUBLIC_KEY }}
          CRM_TLS_CERT: ${{ secrets.CRM_TLS_CERT }}
          CRM_TLS_KEY: ${{ secrets.CRM_TLS_KEY }}
        run: bash scripts/release.sh secrets
      - name: Deploy
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_REGISTRY: ghcr.io/${{ github.repository_owner }}/
          PLATFORM_HOSTNAME: ${{ vars.PLATFORM_HOSTNAME }}
          INGRESS_CLASS: ${{ vars.INGRESS_CLASS }}
          STORAGE_CLASS: ${{ vars.STORAGE_CLASS }}
        run: |
          set -o pipefail
          export EXPECTED_REGISTRY="${EXPECTED_REGISTRY,,}"
          bash scripts/release.sh deploy release/artifact-manifest.json 2>&1 | tee release.log
      - name: Smoke
        id: smoke
        env:
          SMOKE_URL: https://${{ vars.PLATFORM_HOSTNAME }}
          SMOKE_AGENT_PASSWORD: ${{ secrets.CRM_AGENT_PASSWORD }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
        run: |
          set -o pipefail
          bash scripts/smoke.sh | tee -a release.log
      - name: Record result
        if: always() && steps.smoke.outcome != 'skipped'
        run: bash scripts/release.sh mark "${{ steps.smoke.outcome == 'success' && 'succeeded' || 'failed' }}"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release $GITHUB_REF_NAME"
            if [ "${{ steps.smoke.outcome }}" = success ]; then
              echo "Deployed and smoke passed. This pair is now the rollback target."
            else
              echo "Not released: the deploy or smoke failed. The last known-good pair is unchanged; run the rollback job to restore it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-log
          path: release.log
          retention-days: 90
          if-no-files-found: warn

  # --- rollback: restore the last known-good pair, then smoke again ---
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cluster credentials
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s\n' "$KUBECONFIG_DATA" > "$KUBECONFIG"
      - name: Rollback
        run: |
          set -o pipefail
          bash scripts/release.sh rollback 2>&1 | tee release.log
      - name: Smoke
        id: smoke
        env:
          SMOKE_URL: https://${{ vars.PLATFORM_HOSTNAME }}
          SMOKE_AGENT_PASSWORD: ${{ secrets.CRM_AGENT_PASSWORD }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
        run: |
          set -o pipefail
          bash scripts/smoke.sh | tee -a release.log
      - name: Record result
        if: always() && steps.smoke.outcome != 'skipped'
        run: bash scripts/release.sh mark "${{ steps.smoke.outcome == 'success' && 'succeeded' || 'failed' }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-log
          path: release.log
          retention-days: 90
          if-no-files-found: warn

  # --- restore-drill: fresh backup, restore it into a scratch database, time it, compare row counts ---
  restore-drill:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'restore-drill'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cluster credentials
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s\n' "$KUBECONFIG_DATA" > "$KUBECONFIG"
      - name: Restore drill
        run: |
          set -o pipefail
          bash scripts/release.sh restore-drill 2>&1 | tee restore-drill.log
          grep '^RESTORE ' restore-drill.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: restore-drill-log
          path: restore-drill.log
          retention-days: 90
          if-no-files-found: warn

  # --- infra: Terraform plan (and apply on infra-apply), Ansible check (or two real runs on infra-apply) ---
  infra:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'infra-')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cluster credentials
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s\n' "$KUBECONFIG_DATA" > "$KUBECONFIG"
      - name: Install Terraform and Ansible
        run: bash scripts/install-iac-tools.sh
      - name: Terraform plan
        id: plan
        working-directory: infra/terraform
        env:
          TF_VAR_ingress_namespace: ${{ vars.INGRESS_NAMESPACE }}
          TF_VAR_storage_class: ${{ vars.STORAGE_CLASS }}
        run: |
          terraform init -input=false > /dev/null
          terraform plan -input=false -lock-timeout=120s -out=tfplan > /dev/null
          terraform show -json tfplan | jq -S '[.resource_changes[]?
            | {address, actions: .change.actions, importing: (.change.importing != null), before: .change.before, after: .change.after}]' > changes.json
          digest=$(sha256sum changes.json | cut -c1-16)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan"
            echo "| Resource | Action |"
            echo "|---|---|"
            jq -r 'map(select(.importing or .actions != ["no-op"]))
              | if length == 0 then "| none | no changes |"
                else .[] | "| \(.address) | \(if .importing then "import " else "" end)\(.actions | join(", ")) |" end' changes.json
            echo
            echo "Plan digest \`$digest\`. To apply exactly this plan, run CD with infra-apply and this digest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Ansible check
        if: inputs.action == 'infra-plan'
        run: ansible-playbook -i infra/ansible/inventory.yml --check --diff -e crm_context="$(kubectl config current-context)" infra/ansible/configure.yml
      - name: Terraform apply
        if: inputs.action == 'infra-apply'
        working-directory: infra/terraform
        env:
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          DIGEST: ${{ steps.plan.outputs.digest }}
        run: |
          if [ "$DIGEST" != "$PLAN_DIGEST" ]; then
            echo "::error::This plan is $DIGEST, not the reviewed $PLAN_DIGEST. Run infra-plan again and review it."
            exit 1
          fi
          terraform apply -input=false -lock-timeout=120s tfplan > /dev/null
      - name: Ansible, twice
        if: inputs.action == 'infra-apply'
        run: |
          set -o pipefail
          for run in 1 2; do
            ansible-playbook -i infra/ansible/inventory.yml -e crm_context="$(kubectl config current-context)" \
              infra/ansible/configure.yml | tee "ansible-run-$run.log"
          done
          recap=$(grep -E '^localhost +:' ansible-run-2.log)
          echo "### Ansible second run" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$recap\`" >> "$GITHUB_STEP_SUMMARY"
          idempotent='changed=0 +unreachable=0 +failed=0'
          [[ "$recap" =~ $idempotent ]] || { echo "::error::The second run changed something, so the playbook isn't idempotent."; exit 1; }
