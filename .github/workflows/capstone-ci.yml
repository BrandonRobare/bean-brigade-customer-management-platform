# .github/workflows/capstone-ci.yml
name: Capstone CI

on:
  pull_request:
  push:
    branches: [main]
  # no v* tags: they deploy the digest main already built (capstone-cd.yml), see docs/github-actions-plan.md

permissions:
  contents: read

# stop running CI for the same branch if a new commit is pushed (e.g., PR update) to save GitHub Actions minutes
# and avoid race conditions. Only cancel for PRs, not for main pushes, so every main commit gets a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- frontend: npm ci + unit tests + production build, dist + checksum for the image job ---
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx ng build --configuration=production
      - name: Checksum dist
        working-directory: frontend/dist
        run: find lab50-crm-ui -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crm-ui-dist
          path: frontend/dist/
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  # --- backend: mvn verify against postgres, JAR + checksum for the image job ---
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crm
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: change-me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
      - name: Checksum JAR
        working-directory: backend/target
        run: |
          sha256sum *.jar > SHA256SUMS
          echo "commit=${GITHUB_SHA}" >> SHA256SUMS
          echo "run=${GITHUB_RUN_NUMBER}" >> SHA256SUMS
          echo "version=$(../mvnw -B -q -f ../pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crm-api-jar
          path: |
            backend/target/*.jar
            backend/target/SHA256SUMS
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  # --- scan: OWASP Dependency-Check on maven deps, npm audit on production npm deps; both block at high ---
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: NVD cache day
        id: nvd-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ steps.nvd-day.outputs.day }}
          restore-keys: dependency-check-${{ runner.os }}-
      - name: Dependency-Check
        env:
          NVD_SECRET: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_SECRET" ]; then export NVD_API_KEY="$NVD_SECRET"; fi
          ./mvnw -B -ntp -Psecurity-scan dependency-check:check -DdataDirectory="$HOME/.dependency-check-data"
      - name: Findings summary
        if: always()
        run: |
          report=target/dependency-check-report.json
          {
            echo "### Dependency-Check"
            if [ -f "$report" ]; then
              echo "| Severity | Findings |"
              echo "|---|---|"
              jq -r '[.dependencies[].vulnerabilities[]?.severity | ascii_upcase]
                | if length == 0 then "| none | 0 |"
                  else group_by(.) | map("| \(.[0]) | \(length) |") | .[] end' "$report"
              echo
              echo "Triage in \`docs/security-findings.csv\`. Full report in the \`dependency-check-report\` artifact."
            else
              echo "No report: the scan didn't finish. Check the Dependency-Check step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn
      - name: npm audit
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json || true
      - name: npm audit gate
        if: always()
        working-directory: .
        run: python3 .github/scripts/check-npm-audit.py frontend/npm-audit.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit.json
          if-no-files-found: warn

  # --- sast: CodeQL on java, typescript and the workflows; results in the Security tab, fails at high/critical ---
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test CI scripts
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s .github/scripts/tests -v 2>&1 | tee ci-script-tests.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ci-script-tests
          path: ci-script-tests.txt
          if-no-files-found: warn
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin, javascript-typescript, actions
      - name: Build backend for CodeQL
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests compile
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: codeql-results
      - name: CodeQL gate
        if: always()
        run: python3 .github/scripts/check-codeql-sarif.py codeql-results/*.sarif >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: codeql-report
          path: codeql-results/
          if-no-files-found: warn

  # --- secrets: gitleaks over the full git history ---
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Gitleaks
        run: ./gitleaks git . --redact --report-format json --report-path gitleaks.json -v
      - name: Findings summary
        if: always()
        run: |
          {
            echo "### Gitleaks"
            if [ -f gitleaks.json ]; then
              echo "Scanned $(git rev-list --count HEAD) commits."
              echo
              echo "| Rule | Findings |"
              echo "|---|---|"
              jq -r 'if length == 0 then "| none | 0 |"
                else group_by(.RuleID) | map("| \(.[0].RuleID) | \(length) |") | .[] end' gitleaks.json
              echo
              echo "Secrets are redacted. A real one gets rotated, a false positive goes in \`.gitleaksignore\` with a reason."
            else
              echo "No report: the scan didn't finish. Check the Gitleaks step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: warn

  # --- iac: Trivy misconfiguration scan of the manifests and Terraform, Terraform validate, Ansible syntax and lint ---
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Trivy
        run: |
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy_0.75.0_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf trivy_0.75.0_Linux-64bit.tar.gz trivy
      - name: Trivy config report
        run: |
          ./trivy config --quiet --format json --output trivy-config.json k8s
          ./trivy config --quiet --format json --output trivy-terraform.json infra/terraform
      - name: Trivy config gate
        run: |
          ./trivy config --quiet --severity HIGH,CRITICAL --exit-code 1 --ignorefile k8s/.trivyignore.yaml k8s
          ./trivy config --quiet --severity HIGH,CRITICAL --exit-code 1 infra/terraform
      - name: Install Terraform and Ansible
        run: bash scripts/install-iac-tools.sh
      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Ansible syntax and lint
        working-directory: infra/ansible
        run: |
          ansible-playbook -i inventory.yml --syntax-check configure.yml
          ansible-lint configure.yml
      - name: Findings summary
        if: always()
        run: |
          {
            echo "### IaC (Trivy config)"
            for report in trivy-config.json trivy-terraform.json; do
              echo
              if [ -f "$report" ]; then
                echo "| $report severity | Findings |"
                echo "|---|---|"
                jq -r '[.Results[]?.Misconfigurations[]?.Severity]
                  | if length == 0 then "| none | 0 |"
                    else group_by(.) | map("| \(.[0]) | \(length) |") | .[] end' "$report"
              else
                echo "No $report: the scan didn't finish. Check the Trivy config step log."
              fi
            done
            echo
            echo "Fails at HIGH/CRITICAL not triaged in \`k8s/.trivyignore.yaml\`. Full reports in the \`iac-report\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: iac-report
          path: trivy-*.json
          if-no-files-found: warn

  # --- image: build API + UI from the verified JAR and dist, Trivy scan and DAST on every run, push the pair to GHCR on main only ---
  image:
    needs: [frontend, backend, scan, sast, secrets, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: crm-api-jar
          path: backend/target
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: crm-ui-dist
          path: frontend/dist
      - name: Verify checksums
        run: |
          (cd backend/target && grep '\.jar$' SHA256SUMS | sha256sum -c -)
          cd frontend/dist
          sha256sum -c --quiet SHA256SUMS
          diff <(find lab50-crm-ui -type f | sort) <(awk '{print $2}' SHA256SUMS | sort)
      - name: Build
        run: |
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "API_IMAGE=$owner/crm-api:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "UI_IMAGE=$owner/crm-ui:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          for app in api:backend ui:frontend; do
            docker build \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -t "$owner/crm-${app%%:*}:sha-$GITHUB_SHA" "${app#*:}"
          done
      - name: Install Trivy
        run: |
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy_0.75.0_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf trivy_0.75.0_Linux-64bit.tar.gz trivy
      - name: Trivy DB cache day
        id: trivy-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-day.outputs.day }}
          restore-keys: trivy-db-
      - name: Trivy report
        run: |
          ./trivy image --quiet --format json --output trivy-api.json "$API_IMAGE"
          ./trivy image --quiet --skip-db-update --format json --output trivy-ui.json "$UI_IMAGE"
      - name: Trivy gate
        run: |
          ./trivy image --quiet --skip-db-update --severity CRITICAL --exit-code 1 --ignorefile backend/.trivyignore.yaml "$API_IMAGE"
          ./trivy image --quiet --skip-db-update --severity CRITICAL --exit-code 1 "$UI_IMAGE"
      - name: DAST
        id: dast
        run: bash scripts/dast.sh
      - name: DAST gate
        if: always() && steps.dast.outcome != 'skipped'
        run: python3 .github/scripts/check-zap-report.py dast-report/zap.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.dast.outcome != 'skipped'
        with:
          name: dast-report
          path: dast-report/
          if-no-files-found: warn
      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$API_IMAGE"
          docker push "$UI_IMAGE"
          echo "API_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE" | cut -d@ -f2)" >> "$GITHUB_ENV"
          echo "UI_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$UI_IMAGE" | cut -d@ -f2)" >> "$GITHUB_ENV"
      - name: Manifest
        if: github.ref == 'refs/heads/main'
        run: |
          API_REPO="${API_IMAGE%:*}" UI_REPO="${UI_IMAGE%:*}" \
            bash .github/scripts/write-artifact-manifest.sh > artifact-manifest.json
          cat artifact-manifest.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### Images"
            if [ -s artifact-manifest.json ]; then
              echo "Pushed \`${API_IMAGE%:*}@$API_DIGEST\` and \`${UI_IMAGE%:*}@$UI_DIGEST\`. Deploy this pair by digest, never by tag."
            elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "PR run: not pushed, only \`main\` pushes."
            else
              echo "Not pushed. Check the Trivy gate, Push and Manifest steps."
            fi
            for app in api ui; do
              if [ -f "trivy-$app.json" ]; then
                echo
                echo "| crm-$app severity | Findings |"
                echo "|---|---|"
                jq -r '[.Results[]?.Vulnerabilities[]?.Severity]
                  | if length == 0 then "| none | 0 |"
                    else group_by(.) | map("| \(.[0]) | \(length) |") | .[] end' "trivy-$app.json"
              fi
            done
            echo
            echo "Fails at CRITICAL not triaged in \`backend/.trivyignore.yaml\`. Full reports in the \`image-report\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: image-report
          path: |
            artifact-manifest.json
            trivy-*.json
          if-no-files-found: warn
