# .github/workflows/capstone-ci.yml
name: Capstone CI

# every PR and every merge to main gets built and tested. frontend and backend are required checks, so a red one blocks the merge.
on:
  pull_request:
  push:
    branches: [main]
  # no v* tags: they deploy the digest main already built (capstone-cd.yml), see docs/github-actions-plan.md

permissions:
  contents: read

# stop running CI for the same branch if a new commit is pushed (e.g., PR update) to save GitHub Actions minutes and avoid race conditions.
# only cancel for PRs, not for main pushes, so every main commit gets a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # job ids frontend and backend are the required check names in protect-main, don't rename them.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # node 22 per the capstone brief (lab 51 starter says 20)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # exact versions from package-lock.json
      - run: npm ci
      # fails the check if the angular app doesn't compile. add ng test once there are specs.
      - run: npx ng build --configuration=production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # throwaway postgres for the tests. same db/user/password as compose.yaml and InteractionApiIT, so these aren't secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        # wait until postgres accepts connections, or maven can start first and fail at random
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crm
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # compile + run every test against the postgres above. never -DskipTests. -ntp hides download noise.
      - name: Verify
        run: mvn -B -ntp clean verify

  # TODO(#49): package-once on main only: JAR + SHA256SUMS, image, digest. v* tags reuse it in CD, never rebuild.
