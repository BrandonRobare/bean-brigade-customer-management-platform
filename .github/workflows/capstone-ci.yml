# .github/workflows/capstone-ci.yml
name: Capstone CI

on:
  pull_request:
  push:
    branches: [main]
  # no v* tags: they deploy the digest main already built (capstone-cd.yml), see docs/github-actions-plan.md

permissions:
  contents: read

# stop running CI for the same branch if a new commit is pushed (e.g., PR update) to save GitHub Actions minutes
# and avoid race conditions. Only cancel for PRs, not for main pushes, so every main commit gets a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- frontend: npm ci + production build ---
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production

  # --- backend: mvn verify against postgres, JAR + checksum for the image job ---
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crm
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: change-me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Checksum JAR
        working-directory: backend/target
        run: |
          sha256sum *.jar > SHA256SUMS
          echo "commit=${GITHUB_SHA}" >> SHA256SUMS
          echo "run=${GITHUB_RUN_NUMBER}" >> SHA256SUMS
          echo "version=$(mvn -B -q -f ../pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crm-api-jar
          path: |
            backend/target/*.jar
            backend/target/SHA256SUMS
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}

  # --- scan: OWASP Dependency-Check on maven deps ---
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: NVD cache week
        id: nvd-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}
          restore-keys: dependency-check-${{ runner.os }}-
      - name: Dependency-Check
        continue-on-error: true
        env:
          NVD_SECRET: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_SECRET" ]; then export NVD_API_KEY="$NVD_SECRET"; fi
          mvn -B -ntp -Psecurity-scan dependency-check:check -DdataDirectory="$HOME/.dependency-check-data"
      - name: Findings summary
        if: always()
        run: |
          report=target/dependency-check-report.json
          {
            echo "### Dependency-Check"
            if [ -f "$report" ]; then
              echo "| Severity | Findings |"
              echo "|---|---|"
              jq -r '[.dependencies[].vulnerabilities[]?.severity | ascii_upcase]
                | if length == 0 then "| none | 0 |"
                  else group_by(.) | map("| \(.[0]) | \(length) |") | .[] end' "$report"
              echo
              echo "Triage in \`docs/security-findings.csv\`. Full report in the \`dependency-check-report\` artifact."
            else
              echo "No report: the scan didn't finish. Check the Dependency-Check step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

  # --- sast: CodeQL on java, typescript and the workflows; results in the Security tab, fails at high/critical ---
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test CI scripts
        run: python3 -B -m unittest discover -s .github/scripts/tests -v
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin, javascript-typescript, actions
      - name: Build backend for CodeQL
        working-directory: backend
        run: mvn -B -ntp -DskipTests compile
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: codeql-results
      - name: CodeQL gate
        if: always()
        run: python3 .github/scripts/check-codeql-sarif.py codeql-results/*.sarif >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: codeql-report
          path: codeql-results/
          if-no-files-found: warn

  # --- secrets: gitleaks over the full git history ---
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Gitleaks
        run: ./gitleaks git . --redact --report-format json --report-path gitleaks.json -v
      - name: Findings summary
        if: always()
        run: |
          {
            echo "### Gitleaks"
            if [ -f gitleaks.json ]; then
              echo "Scanned $(git rev-list --count HEAD) commits."
              echo
              echo "| Rule | Findings |"
              echo "|---|---|"
              jq -r 'if length == 0 then "| none | 0 |"
                else group_by(.RuleID) | map("| \(.[0].RuleID) | \(length) |") | .[] end' gitleaks.json
              echo
              echo "Secrets are redacted. A real one gets rotated, a false positive goes in \`.gitleaksignore\` with a reason."
            else
              echo "No report: the scan didn't finish. Check the Gitleaks step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: warn

  # --- image: build from the verified JAR and Trivy scan on every run, push to GHCR on main only ---
  image:
    needs: [backend, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: crm-api-jar
          path: backend/target
      - name: Verify JAR checksum
        working-directory: backend/target
        run: grep '\.jar$' SHA256SUMS | sha256sum -c -
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crm-api"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image:sha-$GITHUB_SHA" backend
      - name: Install Trivy
        run: |
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy_0.75.0_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf trivy_0.75.0_Linux-64bit.tar.gz trivy
      - name: Trivy DB cache day
        id: trivy-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-day.outputs.day }}
          restore-keys: trivy-db-
      - name: Trivy report
        run: ./trivy image --quiet --format json --output trivy.json "$IMAGE:sha-$GITHUB_SHA"
      - name: Trivy gate
        run: ./trivy image --quiet --skip-db-update --severity CRITICAL --exit-code 1 --ignorefile backend/.trivyignore.yaml "$IMAGE:sha-$GITHUB_SHA"
      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA" | cut -d@ -f2)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Manifest
        if: github.ref == 'refs/heads/main'
        run: |
          sums=backend/target/SHA256SUMS
          jq -n \
            --arg version "$(sed -n 's/^version=//p' $sums)" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg jar "$(awk '/\.jar$/ {print $1}' $sums)" \
            --arg repo "$IMAGE" \
            --arg digest "$DIGEST" \
            '{application: "crm-api", version: $version, gitCommit: $commit, runId: $run, jarSha256: $jar,
              imageRepository: $repo, imageDigest: $digest, builtBy: "capstone-ci"}' > artifact-manifest.json
          cat artifact-manifest.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### Image"
            if [ -n "$DIGEST" ]; then
              echo "Pushed \`$IMAGE@$DIGEST\`. Deploy by this digest, never by tag."
            elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "PR run: not pushed, only \`main\` pushes."
            else
              echo "Not pushed. Check the Trivy gate and Push steps."
            fi
            if [ -f trivy.json ]; then
              echo
              echo "| Severity | Findings |"
              echo "|---|---|"
              jq -r '[.Results[]?.Vulnerabilities[]?.Severity]
                | if length == 0 then "| none | 0 |"
                  else group_by(.) | map("| \(.[0]) | \(length) |") | .[] end' trivy.json
              echo
              echo "Fails at CRITICAL not triaged in \`backend/.trivyignore.yaml\`. Full report in the \`image-report\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: image-report
          path: |
            artifact-manifest.json
            trivy.json
          if-no-files-found: warn
