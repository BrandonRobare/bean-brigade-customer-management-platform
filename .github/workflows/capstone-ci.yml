# .github/workflows/capstone-ci.yml
name: Capstone CI

on:
  pull_request:
  push:
    branches: [main]
  # no v* tags: they deploy the digest main already built (capstone-cd.yml), see docs/github-actions-plan.md

permissions:
  contents: read

# stop running CI for the same branch if a new commit is pushed (e.g., PR update) to save GitHub Actions minutes
# and avoid race conditions. Only cancel for PRs, not for main pushes, so every main commit gets a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crm
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      # #49: package once on main, JAR + checksum from this verify. image step still to do.
      - name: Checksum JAR
        if: github.ref == 'refs/heads/main'
        working-directory: backend/target
        run: |
          sha256sum *.jar > SHA256SUMS
          echo "commit=${GITHUB_SHA}" >> SHA256SUMS
          echo "run=${GITHUB_RUN_NUMBER}" >> SHA256SUMS
      # #49: upload JAR + SHA256SUMS as the run artifact
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: crm-api-jar
          path: |
            backend/target/*.jar
            backend/target/SHA256SUMS

  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # #55: NVD data lives outside ~/.m2 so the maven cache doesn't swallow it. weekly key, newest older week as fallback
      - name: NVD cache week
        id: nvd-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}
          restore-keys: dependency-check-${{ runner.os }}-
      # #55: report-only
      - name: Dependency-Check
        continue-on-error: true
        env:
          NVD_SECRET: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_SECRET" ]; then export NVD_API_KEY="$NVD_SECRET"; fi
          mvn -B -ntp -Psecurity-scan dependency-check:check -DdataDirectory="$HOME/.dependency-check-data"
      - name: Findings summary
        if: always()
        run: |
          report=target/dependency-check-report.json
          {
            echo "### Dependency-Check"
            if [ -f "$report" ]; then
              echo "| Severity | Findings |"
              echo "|---|---|"
              jq -r '[.dependencies[].vulnerabilities[]?.severity | ascii_upcase]
                | if length == 0 then "| none | 0 |"
                  else group_by(.) | map("| \(.[0]) | \(length) |") | .[] end' "$report"
              echo
              echo "Triage in \`docs/security-findings.csv\`. Full report in the \`dependency-check-report\` artifact."
            else
              echo "No report: the scan didn't finish. Check the Dependency-Check step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn
