# .github/workflows/capstone-ci.yml
name: Capstone CI

on:
  pull_request:
  push:
    branches: [main]
  # no v* tags: they deploy the digest main already built (capstone-cd.yml), see docs/github-actions-plan.md

permissions:
  contents: read

# stop running CI for the same branch if a new commit is pushed (e.g., PR update) to save GitHub Actions minutes
# and avoid race conditions. Only cancel for PRs, not for main pushes, so every main commit gets a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crm
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      # #49: package once on main, JAR + checksum from this verify. image step still to do.
      - name: Checksum JAR
        if: github.ref == 'refs/heads/main'
        working-directory: backend/target
        run: |
          sha256sum *.jar > SHA256SUMS
          echo "commit=${GITHUB_SHA}" >> SHA256SUMS
          echo "run=${GITHUB_RUN_NUMBER}" >> SHA256SUMS
      # #49: upload JAR + SHA256SUMS as the run artifact
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: crm-api-jar
          path: |
            backend/target/*.jar
            backend/target/SHA256SUMS
