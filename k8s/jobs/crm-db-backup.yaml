apiVersion: batch/v1
kind: Job
metadata:
  name: crm-db-backup
  labels: {app.kubernetes.io/name: crm-db-backup, app.kubernetes.io/part-of: bean-brigade}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: crm-db-backup, app.kubernetes.io/part-of: bean-brigade}
    spec:
      serviceAccountName: crm-runtime
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backup
          image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
          command: [/bin/bash, -euo, pipefail, -c]
          args:
            - |
              tries=0
              until pg_isready --host crm-postgres --username crm --dbname crm --timeout 2 > /dev/null; do
                [ $((tries += 1)) -lt 15 ] || { echo "crm-postgres not reachable"; exit 1; }
                sleep 2
              done
              rm -f /backup/crm-*.dump.part
              file=/backup/crm-$(date -u +%Y%m%dT%H%M%SZ).dump
              pg_dump --host crm-postgres --username crm --dbname crm --format custom --file "$file.part"
              mv "$file.part" "$file"
              ls -1t /backup/crm-*.dump | tail -n +6 | xargs -r rm --
              echo "BACKUP $file $(stat -c %s "$file")"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: crm-db, key: password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: backup, mountPath: /backup}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: backup
          persistentVolumeClaim: {claimName: crm-backup}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
