apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
    scrape_configs:
      - job_name: crm-api
        metrics_path: /actuator/prometheus
        dns_sd_configs:
          - names: [crm-api-metrics]
            type: A
            port: 8081
            refresh_interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: crm-prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crm-prometheus}
    spec:
      serviceAccountName: crm-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.1@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=256MB
          ports: [{name: http, containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 100m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: crm-prometheus-config}
        - name: data
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crm-prometheus
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: crm-prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: crm-api-metrics
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: crm-api}
  ports: [{name: management, port: 8081, targetPort: management}]
