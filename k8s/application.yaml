apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 240
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: crm-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crm-api}
    spec:
      serviceAccountName: crm-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          # The release pipeline must replace this with the verified CI digest.
          image: ghcr.io/brandonrobare/crm-api:release-required
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: crm-api-config}
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: crm-db, key: password}
            - name: DEMO_AGENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: crm-auth, key: agent-password}
            - name: DEMO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: crm-auth, key: admin-password}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - {name: jwt, mountPath: /var/run/secrets/jwt, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: jwt
          secret: {secretName: crm-jwt, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crm-api
spec:
  selector: {app.kubernetes.io/name: crm-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: crm-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: crm-ui}
    spec:
      serviceAccountName: crm-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          image: ghcr.io/brandonrobare/crm-ui:release-required
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: crm-ui
spec:
  selector: {app.kubernetes.io/name: crm-ui}
  ports: [{name: http, port: 8080, targetPort: http}]
