apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-default-deny
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: bean-brigade}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-dns
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: bean-brigade}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [crm-api, crm-ui]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform-ingress-namespace-required}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-api-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: crm-api}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: crm-postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: crm-kafka}
      ports: [{protocol: TCP, port: 9092}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-postgres-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: crm-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: crm-api}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-kafka
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: crm-kafka}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [crm-api, crm-kafka-topics]
      ports: [{protocol: TCP, port: 9092}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: crm-kafka}
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: crm-kafka}
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crm-topics-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: crm-kafka-topics}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: crm-kafka}
      ports: [{protocol: TCP, port: 9092}]
